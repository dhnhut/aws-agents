  # 2.1 AgentCore Permissions (Updated Principal)
  #
  # Change the Principal to bedrock-agentcore.amazonaws.com for AgentCore Harness
  # Principal: bedrock.amazonaws.com # original Classic Bedrock
  # Principal: bedrock-agentcore.amazonaws.com  # AgentCore
  
  GetCuisinesPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GetCuisinesFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com  # changed to AgentCore

  SearchRestaurantsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SearchRestaurantsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com  # changed to AgentCore

  GetAvailabilityPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GetAvailabilityFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com  # changed to AgentCore

  # 2.2 AgentCore IAM Role for Gateway
  #
  # The AgentCore Gateway needs an IAM Role to invoke the Lambda functions.

  RestaurantAgentGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
