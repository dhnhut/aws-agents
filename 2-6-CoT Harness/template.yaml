                  - !GetAtt GetAvailabilityFunction.Arn
  
  # 2.3 AgentCore Gateway and Targets

  # The Gateway acts as the secure connectivity layer between the Harness and your tools
  RestaurantAgentGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: restaurant-agent-gateway
      Description: "Unified gateway routing for restaurant recommendation tools"
      AuthorizerType: NONE
      ProtocolType: MCP
      RoleArn: !GetAtt RestaurantAgentGatewayRole.Arn

  # Gateway Targets map your Lambda functions into the Gateway
  GetCuisinesTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
