# Auto-generated from template_base.yaml — do not edit directly.
# Updated for Amazon Bedrock AgentCore Harness architecture

AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda functions and AgentCore Harness for the restaurant recommendation agent

Resources:

  # Role for Lambda functions to execute with basic permissions
  # Unchanged from original template
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: restaurant-agentcore-harness-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # ---------------------------------------------------------
  # 1. Lambda Functions
  # 
  # Logic Unchanged
  # convert return strutured JSON-RPC responses for AgentCore Harness
  # ---------------------------------------------------------
  GetCuisinesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: get-cuisines
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json


          RESTAURANTS = [
              {"id": "r1", "name": "Trattoria Bella", "cuisine": "Italian",  "rating": 4.6},
              {"id": "r2", "name": "Osteria Romana",  "cuisine": "Italian",  "rating": 4.4},
              {"id": "r3", "name": "Sakura Garden",   "cuisine": "Japanese", "rating": 4.7},
              {"id": "r4", "name": "Ramen Yuki",      "cuisine": "Japanese", "rating": 4.9},
              {"id": "r5", "name": "El Mercado",      "cuisine": "Mexican",  "rating": 4.3},
              {"id": "r6", "name": "Spice Route",     "cuisine": "Indian",   "rating": 4.6},
              {"id": "r7", "name": "Le Bistro",       "cuisine": "French",   "rating": 4.8},
              {"id": "r8", "name": "The Grill House", "cuisine": "American", "rating": 4.2},
          ]


          def lambda_handler(event, context):
            cuisines = sorted(set(r["cuisine"] for r in RESTAURANTS))
            result = {"cuisines": cuisines}

            # Return MCP-compliant JSON-RPC response
            return {
                "jsonrpc": "2.0",
                "id": event.get("id", "1"),
                "result": {
                    "content": [
                        {
                            "type": "text",
                            "text": json.dumps(result)
                        }
                    ],
                    "isError": False
                }
            }

  SearchRestaurantsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: search-restaurants
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json

          RESTAURANTS = [
              {"id": "r1", "name": "Trattoria Bella", "cuisine": "Italian",  "rating": 4.6},
              {"id": "r2", "name": "Osteria Romana",  "cuisine": "Italian",  "rating": 4.4},
              {"id": "r3", "name": "Sakura Garden",   "cuisine": "Japanese", "rating": 4.7},
              {"id": "r4", "name": "Ramen Yuki",      "cuisine": "Japanese", "rating": 4.9},
              {"id": "r5", "name": "El Mercado",      "cuisine": "Mexican",  "rating": 4.3},
              {"id": "r6", "name": "Spice Route",     "cuisine": "Indian",   "rating": 4.6},
              {"id": "r7", "name": "Le Bistro",       "cuisine": "French",   "rating": 4.8},
              {"id": "r8", "name": "The Grill House", "cuisine": "American", "rating": 4.2},
          ]

          def lambda_handler(event, context):
              # 1. Parse MCP arguments
              # MCP passes the inputs inside params.arguments
              arguments = event.get("params", {}).get("arguments", {})
              
              # Fallback just in case AWS strips the MCP wrapper and sends direct arguments
              if not arguments and "cuisine" in event:
                  arguments = event
                  
              cuisine = arguments.get("cuisine", "").lower()

              # 2. Execute business logic
              if cuisine:
                  restaurants = [r for r in RESTAURANTS if r["cuisine"].lower() == cuisine]
                  if not restaurants:
                      result = {"error": f"No {cuisine.title()} restaurants found."}
                  else:
                      result = {"restaurants": restaurants}
              else:
                  result = {"restaurants": RESTAURANTS}

              # 3. Return MCP-compliant JSON-RPC response
              return {
                  "jsonrpc": "2.0",
                  "id": event.get("id", "1"),
                  "result": {
                      "content": [
                          {
                              "type": "text",
                              "text": json.dumps(result)
                          }
                      ],
                      "isError": False
                  }
              }

  GetAvailabilityFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: get-availability
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json


          AVAILABILITY = {
              "r1": True,
              "r2": False,
              "r3": True,
              "r4": False,
              "r5": True,
              "r6": True,
              "r7": False,
              "r8": True,
          }


          def lambda_handler(event, context):
            # Parse MCP arguments
            arguments = event.get("params", {}).get("arguments", {})
            
            # Fallback in case the gateway passes raw arguments
            if not arguments and "restaurant_id" in event:
                arguments = event
                
            restaurant_id = arguments.get("restaurant_id", "")

            available = AVAILABILITY.get(restaurant_id, False)
            result = {
                "restaurant_id": restaurant_id,
                "available": available,
            }

            # Return MCP-compliant JSON-RPC response
            return {
                "jsonrpc": "2.0",
                "id": event.get("id", "1"),
                "result": {
                    "content": [
                        {
                            "type": "text",
                            "text": json.dumps(result)
                        }
                    ],
                    "isError": False
                }
            }

